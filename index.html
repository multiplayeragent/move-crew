<!doctype html>
<html lang="en">

<title>Move Crew</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #6fae55; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #0009; font-weight: 800; }
  #score { top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); font-size: 26px; line-height: 1.1; }
  #score small { display: block; font-size: 13px; font-weight: 700; opacity: .9; }
  #clock { top: max(10px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); font-size: 28px; font-variant-numeric: tabular-nums; }
  #clock.low { color: #ffd23f; }
  #net { bottom: max(10px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); font-size: 12px; font-weight: 600; opacity: .85; }
  #count { inset: 0; display: grid; place-items: center; font-size: min(18vw, 120px); color: #ffd23f; -webkit-text-stroke: 3px #6a3a00; }
  #hint { top: calc(max(10px, env(safe-area-inset-top)) + 58px); left: 50%; transform: translateX(-50%); width: min(470px, calc(100vw - 32px)); box-sizing: border-box; text-align: center;
          font-size: 15px; font-weight: 700; padding: 10px 14px; border-radius: 14px; background: #2a2238d9; transition: opacity .6s; }
  #toast { top: 34%; left: 16px; right: 16px; text-align: center; font-size: 22px; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #1d162a88; }
  [hidden] { display: none !important; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); padding: 20px; border-radius: 18px; background: #2a2238; border: 1px solid #ffffff2a; text-align: center; box-shadow: 0 10px 30px #0006; }
  .card h2 { margin: 0 0 2px; font-size: 23px; } .card h3 { margin: 12px 0 4px; font-size: 14px; color: #ffd23f; }
  .card .stars { font-size: 34px; letter-spacing: 6px; color: #ffd23f; } .card .stars i { color: #ffffff30; font-style: normal; }
  .card p { margin: 4px 0; font-size: 14px; opacity: .88; }
  .card ol { text-align: left; margin: 0 0 12px; padding-left: 26px; font-size: 14px; min-height: 40px; } .card li span { float: right; font-variant-numeric: tabular-nums; }
  .card li.msg { list-style: none; margin-left: -26px; text-align: center; } /* a status line, not a numbered entry */
  button.go { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #ff8c42; color: #2a1400; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .pad { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); display: flex; gap: 14px; align-items: flex-end; }
  .pad button { width: 84px; height: 84px; border-radius: 50%; border: 2px solid #ffffff99; background: #2a223855; color: #fff; font: 800 14px system-ui, sans-serif; touch-action: none; }
  .pad button.on { background: #ff8c4288; }
  .attract .hud, .attract .pad { display: none !important; }

<body>

  <h2 id="overTitle"></h2><div class="stars" id="overStars"></div><p id="overSub"></p>

  <button class="go" id="again">Play again</button><p id="overNext"></p>
</div></div>
<script>
/* ═══ MOVE CREW · a Multiplayer Agent starter ═════════════════════════════════════════
 * Empty the house into the truck before time runs out. Co-op, 2–4 players; bot movers help.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ round length, speeds, scoring, the house map and the furniture
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   HOUSE ......... the map: walls, doors, stairs, the truck's cargo grid; walking into walls
 *   FURNITURE ..... the kinds of things to move, where an item is, packing the truck
 *   GAME (HOST) ... rounds, the items, what grab/drop/throw/bump do, scoring. Host only.
 *   BOT MOVERS .... bots fetch boxes, grab the other end of a couch, pack the truck. Host only.
 *   ME ............ walking, carrying (alone or with a partner), bumping fragile things
 *   DRAW .......... the house, furniture, movers, the packing preview, particles
 *   HUD & RESULTS . score, clock, results card and the leaderboard
 *   INPUT ......... keyboard, touch stick, GRAB and THROW buttons
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The HOST is the lowest sessionId among live players (heartbeat `hb` seen in the
 *     last 3s), worked out every frame. The host's browser runs the move.
 *   - The host writes: `game` (ONE JSON field: id, v, phase, timers, score; `v` goes up on
 *     every write), `items` (every piece of furniture: where it rests, who holds which end,
 *     its cracks, its spot in the truck, a throw in flight) and `bots`.
 *   - Each player writes its OWN entity: `p` (position and facing, ~12/s), `n`/`c` (name,
 *     color) and `hb` once a second. While you carry something it moves with YOUR body: the
 *     host only records who holds it, and where it lands when you put it down.
 *   - Intents to the host: "grab" {i, e} (item, which end), "drop" {i, x, y, a} (where it
 *     ends up), "throw" {i, x, y, a}, "bump" {i} (you knocked a fragile item) and "again".
 *     The host checks them and writes `items`. Its own moves apply directly.
 *   - Two-person furniture: each mover holds one end and walks its own body; your game keeps
 *     you about a couch-length from your partner, so you have to steer together.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "move-score": the crew's score at the end of a move.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  roundMs: 120000,     // a move lasts 2 minutes
  readyMs: 3000,       // the countdown before it starts
  resultsMs: 12000,    // the results show this long, then the next house
  speed: 4.2,          // walking speed, tiles/s
  carrySmall: 0.9,     // speed share while carrying a box
  carryHeavy: 0.62,    // ...and while carrying furniture with a partner
  stairs: 0.6,         // speed share on stairs
  reach: 1.1,          // tiles: how close you must be to grab something
  throwDist: 4.5,      // tiles a thrown box flies
  throwMs: 550,        // how long it is in the air
  cracks: 3,           // bumps a fragile item survives (it breaks on this one)
  bumpGapMs: 700,      // at most one bump this often
  brokenPenalty: 10,   // points lost per broken item
  bonusPerSec: 2,      // points per second left when the whole house is packed
  boxes: 10,           // boxes in the house (they go in seeded spots from CONFIG.boxSpots)
  seats: 3,            // bot movers fill the crew up to this many
  botPace: 0.78,       // bots walk at this share of your speed
  board: "move-score", // leaderboard name
  // The map, one character per tile:
  //  # wall   . wood floor   : kitchen tiles   = stairs   , grass   - driveway   T truck bed   X truck body
  layout: [
    ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,",
    ",#################,,,,,,,,,,,,,,",
    ",#::::::#........#,,,,,,,,,,,,,,",
    ",#::::::#........#,,,,,,,,,,,,,,",
    ",#::::::.........#,,,,,,,,,,,,,,",
    ",#::::::.........#,,,,,,,,,,,,,,",
    ",#::::::#........#,,,,,,,,,,,,,,",
    ",#::::::#........#,,,,,,,,,,,,,,",
    ",###..###........#,,,,,,,,,,,,,,",
    ",#......####..####,,,,XXXXXXXXXX",
    ",#......#........#,,--TTTTTTTTXX",
    ",#......#=........==--TTTTTTTTXX",
    ",#.......=........==--TTTTTTTTXX",
    ",#.......=.......#==--TTTTTTTTXX",
    ",#......#=.......#,,,,XXXXXXXXXX",
    ",#......#........#,,,,,,,,,,,,,,",
    ",#################,,,,,,,,,,,,,,",
    ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,",
  ],
  bed: { x: 22, y: 10, w: 8, h: 4 }, // the truck's cargo grid (tiles)
  // Furniture that is always in the house: [kind, x, y, angle]
  furniture: [
    ["c", 4.5, 14.3, 0], ["c", 13.0, 14.45, 0], ["f", 3.3, 2.6, 0], ["d", 12.5, 2.6, 0],
    ["t", 3.0, 10.0, 0], ["v", 6.6, 3.4, 0], ["l", 15.6, 7.6, 0], ["m", 15.6, 11.0, 0],
    ["p", 7.1, 10.0, 0], ["p", 9.8, 7.5, 0],
  ],
  boxSpots: [[5, 5], [6.5, 6.6], [2.9, 6.5], [6.4, 12.2], [3.0, 12.0], [5.4, 10.4], [10.2, 3.0], [15.4, 3.2],
             [11.0, 6.0], [13.6, 5.6], [15.2, 5.0], [11.0, 11.0], [13.8, 11.6], [16.0, 14.0], [12.0, 12.6]],
  spawns: [[19.5, 15.6], [20.6, 15.6], [19.5, 16.6], [20.6, 16.6]],
  attractSpawns: [[7.0, 11.2], [5.5, 13.2], [12.0, 4.2], [11.2, 13.4]], // the preview starts with everyone in the house
};
// The things to move. w×h = cells in the truck; heavy = needs two movers (len = distance between them).
const KINDS = {
  b: { name: "Box", w: 1, h: 1, value: 10, throwable: true },
  p: { name: "Plant", w: 1, h: 1, value: 15, throwable: true },
  t: { name: "TV", w: 1, h: 1, value: 40, fragile: true },
  v: { name: "Vase", w: 1, h: 1, value: 30, fragile: true },
  l: { name: "Lamp", w: 1, h: 1, value: 25, fragile: true },
  m: { name: "Mirror", w: 1, h: 1, value: 35, fragile: true },
  c: { name: "Couch", w: 3, h: 1, value: 60, heavy: true, len: 2.6 },
  f: { name: "Fridge", w: 2, h: 1, value: 50, heavy: true, len: 1.6 },
  d: { name: "Dresser", w: 2, h: 1, value: 45, heavy: true, len: 1.6 },
};
const BOT_NAMES = ["Hank", "Dolly", "Moose", "Tilly", "Bruno", "Pip"];
const BOT_LINES = { help: ["Got the other end!", "Lift on three!", "I'm on it!"], wait: ["Little help here?", "Grab the other end!"], throw: ["Catch!", "Heads up!"] };
const COLORS = ["#ff5a5a", "#4da6ff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#ff6fb5", "#3de0d0"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'move-crew',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback, map = (v) => v) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = map(parse(raw, fallback));
  memo.set(key, { raw, v });
  return v;
}
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── HOUSE ───────────────────────────────────────────────────────────────────────────
const MAP = CONFIG.layout, MW = MAP[0].length, MH = MAP.length, BED = CONFIG.bed;
const tile = (x, y) => (MAP[Math.floor(y)] || "")[Math.floor(x)] || "#";
const solid = (x, y) => { const ch = tile(x, y); return ch === "#" || ch === "X"; };
const onStairs = (x, y) => tile(x, y) === "=";
const inBed = (x, y, m = 0) => x > BED.x + m && x < BED.x + BED.w - m && y > BED.y + m && y < BED.y + BED.h - m;
const R = 0.3; // a mover's body radius, tiles
const blocked = (x, y, r = R) => solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r);
/** Move a body by (dx, dy), sliding along walls. `ok` can add a check of its own (a couch's body). */
function moveBody(e, dx, dy, ok = () => true) {
  let hit = false;
  if (!blocked(e.x + dx, e.y) && ok(e.x + dx, e.y)) e.x += dx; else hit = true;
  if (!blocked(e.x, e.y + dy) && ok(e.x, e.y + dy)) e.y += dy; else hit = true;
  return hit;
}
/** The next tile centre on the shortest walk to (gx, gy). */
function nextStep(x, y, gx, gy) {
  const key = (a, b) => b * MW + a, goal = key(Math.floor(gx), Math.floor(gy)), from = key(Math.floor(x), Math.floor(y)), dist = new Map([[goal, 0]]), q = [goal];
  for (let i = 0; i < q.length; i++) { const c = q[i], cx = c % MW, cy = (c / MW) | 0; for (const [a, b] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) if (a >= 0 && b >= 0 && a < MW && b < MH && !solid(a, b) && !dist.has(key(a, b))) { dist.set(key(a, b), dist.get(c) + 1); q.push(key(a, b)); } }
  const cx = Math.floor(x), cy = Math.floor(y); let best = null, bd = dist.get(from) ?? 1e9;
  for (const [a, b] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) { const d = dist.get(key(a, b)); if (d !== undefined && d < bd) { bd = d; best = { x: a + 0.5, y: b + 0.5 }; } }
  return best || { x: gx, y: gy };
}

// ── FURNITURE ───────────────────────────────────────────────────────────────────────
// An item: { i, k (a KINDS letter), x, y, a (where it rests, and its angle), h: [end 0 holder, end 1 holder]
//   ("" = nobody; small things use h[0]), c (cracks), L: [gx, gy, r] its spot in the truck or null,
//   fl: [fromX, fromY, startedAt] while thrown, or null }
const r2 = (n) => Math.round(n * 100) / 100;
const enc = (it) => [it.i, it.k, r2(it.x), r2(it.y), r2(it.a), it.h[0] || it.h[1] ? [it.h[0], it.h[1]] : 0, it.c, it.L || 0, it.fl || 0];
const dec = ([i, k, x, y, a, h, c, L, fl]) => ({ i, k, x, y, a, h: Array.isArray(h) ? [h[0] || "", h[1] || ""] : ["", ""], c: c || 0, L: Array.isArray(L) ? L : null, fl: Array.isArray(fl) ? fl : null });
const broken = (it) => KINDS[it.k].fragile && it.c >= CONFIG.cracks;
const holds = (it, id) => it.h[0] === id || it.h[1] === id;
const heldCount = (it) => (it.h[0] ? 1 : 0) + (it.h[1] ? 1 : 0);
const flying = (it) => it.fl && Date.now() < it.fl[2] + CONFIG.throwMs;
/** Cells an item takes in the truck: rotation 0 lies along x, 1 along y. */
const foot = (k, r) => (r ? [KINDS[k].h, KINDS[k].w] : [KINDS[k].w, KINDS[k].h]);
const rotOf = (a) => (Math.abs(Math.cos(a)) >= Math.abs(Math.sin(a)) ? 0 : 1);
const spotPose = (k, L) => { const [fw, fh] = foot(k, L[2]); return { x: BED.x + L[0] + fw / 2, y: BED.y + L[1] + fh / 2, a: L[2] ? Math.PI / 2 : 0 }; };
/** Which truck cells are taken (optionally ignoring one item, plus extra reserved spots). */
function occupancy(list, exceptId, extra = []) {
  const g = new Array(BED.w * BED.h).fill(0);
  const mark = (k, L) => { const [fw, fh] = foot(k, L[2]); for (let dy = 0; dy < fh; dy++) for (let dx = 0; dx < fw; dx++) g[(L[1] + dy) * BED.w + L[0] + dx] = 1; };
  for (const it of list) if (it.L && it.i !== exceptId) mark(it.k, it.L);
  for (const [k, L] of extra) mark(k, L);
  return g;
}
const fits = (g, gx, gy, fw, fh) => { if (gx < 0 || gy < 0 || gx + fw > BED.w || gy + fh > BED.h) return false; for (let dy = 0; dy < fh; dy++) for (let dx = 0; dx < fw; dx++) if (g[(gy + dy) * BED.w + gx + dx]) return false; return true; };
/** The free truck spot nearest (cx, cy) within `radius` tiles, for kind k lying at angle a. */
function findSpot(list, k, cx, cy, a, exceptId, radius) {
  const r = KINDS[k].heavy ? rotOf(a) : 0, [fw, fh] = foot(k, r), g = occupancy(list, exceptId);
  let best = null, bd = radius * radius;
  for (let gy = 0; gy <= BED.h - fh; gy++) for (let gx = 0; gx <= BED.w - fw; gx++) {
    if (!fits(g, gx, gy, fw, fh)) continue;
    const d = (BED.x + gx + fw / 2 - cx) ** 2 + (BED.y + gy + fh / 2 - cy) ** 2;
    if (d <= bd) { bd = d; best = [gx, gy, r]; }
  }
  return best;
}
/** One end of a resting heavy item (0 = back, 1 = front along its angle). */
function endOf(it, e) { const half = KINDS[it.k].len / 2, s = e ? 1 : -1; return { x: it.x + s * half * Math.cos(it.a), y: it.y + s * half * Math.sin(it.a) }; }
/** Where an item is right now, as this screen draws it: { x, y, a }. Carried things follow their movers. */
function poseOf(it) {
  if (it.L) return spotPose(it.k, it.L);
  const K = KINDS[it.k];
  if (!K.heavy) {
    const p = it.h[0] && drawPos(it.h[0]);
    return p ? { x: p.x + Math.cos(p.f) * 0.45, y: p.y + Math.sin(p.f) * 0.45, a: 0 } : { x: it.x, y: it.y, a: it.a };
  }
  const half = K.len / 2, p0 = it.h[0] && drawPos(it.h[0]), p1 = it.h[1] && drawPos(it.h[1]);
  if (p0 && p1) return { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2, a: Math.atan2(p1.y - p0.y, p1.x - p0.x) }; // between its two movers
  if (p0 || p1) { // one mover swings it around the end still on the floor
    const e = p0 ? 0 : 1, p = p0 || p1, fixed = endOf(it, 1 - e), d = Math.hypot(p.x - fixed.x, p.y - fixed.y) || 1;
    const a = Math.atan2(fixed.y - p.y, fixed.x - p.x);
    return { x: fixed.x + (p.x - fixed.x) / d * half, y: fixed.y + (p.y - fixed.y) / d * half, a: e === 0 ? a : a + Math.PI };
  }
  return { x: it.x, y: it.y, a: it.a };
}
/** The pose of an item on its way down, with its holder `id`'s end exactly where the holder stands. */
function dropPose(it, id) {
  const q = poseOf(it);
  if (!KINDS[it.k].heavy) return q;
  const p = drawPos(id), e = it.h[0] === id ? 0 : 1, half = KINDS[it.k].len / 2, s = e ? -1 : 1;
  return p ? { x: p.x + s * Math.cos(q.a) * half, y: p.y + s * Math.sin(q.a) * half, a: q.a } : q;
}
/** A packed house: the furniture plus boxes in seeded spots. */
function makeHouse(seed) {
  const rand = mulberry32(seed), items = [];
  for (const [k, x, y, a] of CONFIG.furniture) items.push({ i: items.length + 1, k, x, y, a, h: ["", ""], c: 0, L: null, fl: null });
  const spots = CONFIG.boxSpots.slice();
  for (let n = 0; n < CONFIG.boxes && spots.length; n++) {
    const [x, y] = spots.splice(Math.floor(rand() * spots.length), 1)[0];
    items.push({ i: items.length + 1, k: "b", x: x + (rand() - 0.5) * 0.4, y: y + (rand() - 0.5) * 0.4, a: (rand() - 0.5) * 0.5, h: ["", ""], c: 0, L: null, fl: null });
  }

  if (it.k === "b") { box(0.66, 0.66, "#c8955a", "#8a5f33", 0.06); ctx.fillStyle = "#ead3a6"; ctx.fillRect(-0.08, -0.33, 0.16, 0.66); ctx.strokeStyle = "#a0703f"; ctx.lineWidth = 0.03; ctx.beginPath(); ctx.moveTo(-0.33, 0); ctx.lineTo(0.33, 0); ctx.stroke(); }

  else if (it.k === "t") { box(0.72, 0.46, "#2a2a33", "#111", 0.06); ctx.fillStyle = "#4da6ff"; ctx.fillRect(-0.3, -0.17, 0.6, 0.34); ctx.fillStyle = "#ffffff55"; ctx.fillRect(-0.26, -0.14, 0.18, 0.1); }
  else if (it.k === "v") { dot(0, 0, 0.27, "#3d8fd6"); dot(0, 0, 0.17, "#5aa9e6"); dot(-0.08, -0.09, 0.06, "#ffffffaa"); }
  else if (it.k === "l") { dot(0, 0, 0.31, "#ffe08a"); ctx.strokeStyle = "#c9a640"; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.arc(0, 0, 0.31, 0, Math.PI * 2); ctx.stroke(); dot(0, 0, 0.08, "#8a6a2a"); }
  else if (it.k === "m") { box(0.72, 0.52, "#b07a3a", "#7a5022", 0.06); ctx.fillStyle = "#dfeaf3"; ctx.fillRect(-0.28, -0.18, 0.56, 0.36); ctx.strokeStyle = "#fff"; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.moveTo(-0.15, 0.12); ctx.lineTo(0.05, -0.12); ctx.stroke(); }
  else if (it.k === "c") { box(len, wid, "#d0574f", "#8e2f2a", 0.16); ctx.fillStyle = "#a94039"; rrect(ctx, -len / 2, -wid / 2, len, 0.24, 0.12); ctx.fill(); for (const s of [-1, 1]) { rrect(ctx, s * len / 2 - (s > 0 ? 0.24 : 0), -wid / 2, 0.24, wid, 0.12); ctx.fill(); } ctx.strokeStyle = "#8e2f2a"; ctx.lineWidth = 0.04; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * len / 6, -0.15); ctx.lineTo(s * len / 6, wid / 2 - 0.05); ctx.stroke(); } }
  else if (it.k === "f") { box(len, wid, "#eef2f6", "#9aa5b1", 0.12); ctx.strokeStyle = "#9aa5b1"; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.moveTo(-0.2, -wid / 2); ctx.lineTo(-0.2, wid / 2); ctx.stroke(); ctx.fillStyle = "#7a8794"; ctx.fillRect(-0.4, -0.25, 0.08, 0.5); ctx.fillRect(0.0, -0.25, 0.08, 0.5); ctx.fillStyle = "#4da6ff"; dot(0.55, -0.2, 0.06, "#4da6ff"); }
  else if (it.k === "d") { box(len, wid, "#9c6b3c", "#5e3d1e", 0.08); ctx.strokeStyle = "#5e3d1e"; ctx.lineWidth = 0.04; for (const x of [-len / 6, len / 6]) { ctx.beginPath(); ctx.moveTo(x, -wid / 2); ctx.lineTo(x, wid / 2); ctx.stroke(); } for (const x of [-len / 3, 0, len / 3]) dot(x, 0, 0.05, "#f2d16b"); }
  if (K.fragile && !broken(it)) { // a red FRAGILE sticker and the cracks so far
    dot(0.26, 0.2, 0.1, "#ff4d4d"); ctx.fillStyle = "#fff"; ctx.fillRect(0.245, 0.13, 0.03, 0.09); ctx.fillRect(0.245, 0.245, 0.03, 0.03);
    ctx.strokeStyle = "#1d1626"; ctx.lineWidth = 0.035;
    for (let n = 0; n < it.c; n++) { ctx.beginPath(); ctx.moveTo(-0.25 + n * 0.12, -0.25); ctx.lineTo(-0.12 + n * 0.12, -0.05); ctx.lineTo(-0.2 + n * 0.12, 0.05); ctx.lineTo(-0.05 + n * 0.12, 0.22); ctx.stroke(); }
  }
  ctx.restore();
}
function drawShards() {
  const r = mulberry32(3);
  for (let n = 0; n < 7; n++) { ctx.fillStyle = n % 2 ? "#cfd8e2" : "#8fa0b3"; ctx.beginPath(); const x = (r() - 0.5) * 0.8, y = (r() - 0.5) * 0.6; ctx.moveTo(x, y); ctx.lineTo(x + 0.14, y + 0.05); ctx.lineTo(x + 0.04, y + 0.15); ctx.fill(); }
}
/** A mover from above: shoulders, head, cap (pointing where they face) and hands. */
function drawMover(m, now, carrying) {
  const bob = m.mv ? Math.sin(now / 80 + m.x * 3) * 0.04 : 0;
  ctx.save(); ctx.translate(m.x, m.y);
  ctx.fillStyle = "#0003"; ctx.beginPath(); ctx.ellipse(0.04, 0.1, 0.34, 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(m.f);
  const hand = carrying ? 0.36 : 0.18 + bob;
  for (const s of [-1, 1]) { ctx.fillStyle = "#ffd9b8"; ctx.beginPath(); ctx.arc(hand, s * (carrying ? 0.2 : 0.27), 0.08, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = m.c; ctx.beginPath(); ctx.ellipse(-0.02, 0, 0.25, 0.36 + bob, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#0005"; ctx.lineWidth = 0.04; ctx.stroke();
  ctx.fillStyle = "#ffd9b8"; ctx.beginPath(); ctx.arc(0.03, 0, 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 0.17, Math.PI * 0.5, Math.PI * 1.5); ctx.fill(); ctx.fillStyle = m.c; ctx.fillRect(-0.02, -0.13, 0.25, 0.26);
  ctx.strokeStyle = "#0004"; ctx.beginPath(); ctx.arc(0, 0, 0.17, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
  ctx.restore();
}
// Particles (dust, sparkles, shards) and floating "+40" text.
const parts = [], floaters = [], later = [];
function burst(x, y, color, n, speed, size = 0.08) { for (let i = 0; i < n && parts.length < 400; i++) { const a = Math.random() * 6.28, u = 0.3 + Math.random() * 0.7; parts.push({ x, y, vx: Math.cos(a) * speed * u, vy: Math.sin(a) * speed * u, life: 0, max: 0.4 + Math.random() * 0.4, size, color }); } }
function partsTick(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt; if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92;
    ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function showFx(m) {
  if (!m || !Number.isFinite(m.x) || !Number.isFinite(m.y)) return;
  if (m.d > 0) { later.push({ at: performance.now() + Math.min(2000, m.d), m: { ...m, d: 0 } }); return; }
  if (m.kind === "packed") { burst(m.x, m.y, "#ffd23f", 18, 4); floaters.push({ x: m.x, y: m.y, text: "+" + m.n, color: "#ffd23f", t0: performance.now() }); sfx(700, 0.12); }
  else if (m.kind === "thud" || m.kind === "lift") burst(m.x, m.y, "#e8dcc8", m.kind === "thud" ? 10 : 5, 2, 0.1);
  else if (m.kind === "crack") { burst(m.x, m.y, "#ffffff", 8, 2.5, 0.06); floaters.push({ x: m.x, y: m.y, text: "Crack!", color: "#ff8c42", t0: performance.now() }); sfx(240, 0.08); }
  else if (m.kind === "break") { burst(m.x, m.y, "#cfd8e2", 26, 5, 0.1); floaters.push({ x: m.x, y: m.y, text: `${KINDS[m.k]?.name || "It"} broke!`, color: "#ff5a5a", t0: performance.now() }); sfx(160, 0.25); }
  else if (m.kind === "nofit" && (m.to || []).includes(net.sessionId)) toast("Doesn't fit there");
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let boardApi = null, boardFor = -1, hintUntil = 0, dropped = false;
function toast(text) { $("toast").textContent = text; $("toast").classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("on"), 1600); }
function hud(g) {
  const t = Date.now();
  $("score").innerHTML = `$${g.score}<small>Packed ${g.packed} of ${g.total}${g.broken ? ` · ${g.broken} broken` : ""}</small>`;
  const left = Math.max(0, (g.phase === "over" ? 0 : g.endsAt) - t);
  $("clock").textContent = g.phase === "over" ? "" : `${Math.floor(left / 60000)}:${String(Math.floor((left % 60000) / 1000)).padStart(2, "0")}`;
  $("clock").classList.toggle("low", g.phase === "play" && left < 20000);
  $("count").textContent = g.phase === "ready" ? String(Math.max(1, Math.ceil((g.startAt - t) / 1000))) : g.phase === "play" && t - g.startAt < 900 ? "Lift!" : "";
  const n = humans().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the move" : ""}`;
  $("hint").style.opacity = performance.now() < hintUntil ? 1 : 0;
  $("over").hidden = g.phase !== "over" || ATTRACT;
  if (g.phase === "over") {
    const pct = g.total ? g.packed / g.total : 0, stars = g.done ? 3 : pct >= 0.7 ? 2 : pct >= 0.4 ? 1 : 0;
    $("overTitle").textContent = g.done ? "Truck's packed!" : "Time's up!";
    $("overStars").innerHTML = "★".repeat(stars) + `<i>${"★".repeat(3 - stars)}</i>`;
    $("overSub").innerHTML = `Packed ${g.packed} of ${g.total}${g.broken ? ` · ${g.broken} broken (−${g.broken * CONFIG.brokenPenalty})` : ""}${g.bonus ? ` · +${g.bonus} time bonus` : ""}<br><b>Crew score ${g.final}</b>`;
    $("overNext").textContent = `Next house in ${Math.max(0, Math.ceil((g.endsAt - t) / 1000))}s`;
    if (boardFor !== g.id) { boardFor = g.id; showBoard(g.final); }
  }
}
function showBoard(score) {
  const list = $("board");
  if (!boardApi) { list.innerHTML = "<li class=\"msg\">Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li class=\"msg\">Loading…</li>";
  (score > 0 ? boardApi.submit(score).catch(() => null) : Promise.resolve()).then(() => boardApi.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li class=\"msg\">No scores yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"msg\">Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => act("again", {});
let audio = null;
function sfx(freq, len) {
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator(), gn = audio.createGain(), t = audio.currentTime;
    o.type = "triangle"; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.4, t + len * 0.6);
    gn.gain.setValueAtTime(0.06, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(gn).connect(audio.destination); o.start(t); o.stop(t + len + 0.02);
  } catch {}
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set(), touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("pad").hidden = !touchUI;
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (!keys.has(k) && (k === " " || k === "e")) input.grab = true;
  if (!keys.has(k) && (k === "f" || k === "q")) input.toss = true;
  keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
const stick = { id: null, x: 0, y: 0 };
function readKeys() {
  if (stick.id !== null) return;
  input.x = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
  input.y = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
}
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); if (e.pointerType === "mouse") return; stick.id = e.pointerId; stick.x = e.clientX; stick.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => { if (e.pointerId !== stick.id) return; const dx = e.clientX - stick.x, dy = e.clientY - stick.y, d = Math.hypot(dx, dy); input.x = d > 8 ? dx / Math.max(d, 40) : 0; input.y = d > 8 ? dy / Math.max(d, 40) : 0; });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerId === stick.id) { stick.id = null; input.x = input.y = 0; } });
for (const b of document.querySelectorAll(".pad button")) {
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.classList.add("on"); if (b.dataset.k === "grab") input.grab = true; else input.toss = true; });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => b.classList.remove("on"));
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // no browser menu on a right-click or a long press

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
/** The room can look empty the instant I join: if someone (or a bot) already has my color, take a free one. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botList();
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.some((b) => b.c === myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...bots.map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the move meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  for (let i = later.length - 1; i >= 0; i--) if (realNow >= later[i].at) { showFx(later[i].m); later.splice(i, 1); }
  readKeys();
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  easeOthers(dt);
  if (g) myTick(dt, g);
  placeCamera(dt);
  draw(now, dt);
  if (g && now - lastHud > 120) { lastHud = now; hud(g); }
}

(async function start() {
  document.body.classList.toggle("attract", ATTRACT);
  if (ATTRACT) { CONFIG.seats = 3; $("net").textContent = ""; }
  net = await connect();
  net.onState((st) => { S = st; });
  for (const type of ["grab", "drop", "throw", "bump", "again"]) net.on(type, (m, from) => { if (isHost()) applyIntent(type, m || {}, from); });
  net.on("fx", (m) => showFx(m));
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") boardApi = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  $("hint").textContent = touchUI ? "Drag to walk. GRAB picks up and puts down, THROW tosses boxes. Couches and fridges need two movers: one on each end. Pack the truck!"
    : "WASD to walk, Space to pick up and put down, F to throw boxes. Couches and fridges need two movers: one on each end. Pack the truck!";
  hintUntil = performance.now() + 14000;
  requestAnimationFrame(frame);
})();
</script>
